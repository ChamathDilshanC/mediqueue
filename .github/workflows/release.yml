name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Resolve version
        id: version
        run: |
          tag="${{ github.event.release.tag_name || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "package=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Pin the stack to this release
        run: sed -i -E 's/MEDIQUEUE_VERSION:-[0-9A-Za-z.-]+/MEDIQUEUE_VERSION:-${{ steps.version.outputs.version }}/' compose.yaml .env.example
      - name: Validate compose file
        run: cp .env.example .env && docker compose config --quiet && rm .env
      - name: Build full source archive (with submodules)
        run: |
          name="mediqueue-${{ steps.version.outputs.tag }}"
          tar --exclude-vcs --exclude='.github' --transform "s,^\.,${name}," -czf "${RUNNER_TEMP}/${name}-source.tar.gz" .
      - uses: oras-project/setup-oras@v1
      - name: Publish deployment bundle to GitHub Packages
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          ref="${{ steps.version.outputs.package }}"
          oras push "${ref}:${{ steps.version.outputs.version }}" \
            --artifact-type application/vnd.mediqueue.stack.v1 \
            --annotation "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --annotation "org.opencontainers.image.description=MediQueue platform stack (compose bundle)" \
            --annotation "org.opencontainers.image.version=${{ steps.version.outputs.version }}" \
            compose.yaml:application/yaml .env.example:text/plain
          if [ "${{ github.event_name }}" = "release" ]; then
            oras tag "${ref}:${{ steps.version.outputs.version }}" latest
          fi
      - name: Attach bundle to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.version.outputs.tag }}" \
            "${RUNNER_TEMP}/mediqueue-${{ steps.version.outputs.tag }}-source.tar.gz" compose.yaml .env.example --clobber
