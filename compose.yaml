# MediQueue platform stack built from the released container images.
#   cp .env.example .env            # fill in Supabase, database and Stripe settings
#   docker compose --profile migrate run --rm migrate   # apply database migrations
#   docker compose up -d            # web on :3000, API on :8000
name: mediqueue

x-backend: &backend
  image: ghcr.io/chamathdilshanc/mediqueue-backend:${MEDIQUEUE_VERSION:-1.3.0}
  env_file: .env

services:
  backend:
    <<: *backend
    ports:
      - "8000:8000"
    restart: unless-stopped

  migrate:
    <<: *backend
    command: ["python", "-m", "alembic", "upgrade", "head"]
    profiles: ["migrate"]

  frontend:
    image: ghcr.io/chamathdilshanc/mediqueue-frontend:${MEDIQUEUE_VERSION:-1.3.0}
    environment:
      MEDIQUEUE_API_URL: http://backend:8000
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
